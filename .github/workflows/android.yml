name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # GitHub's ubuntu runners ship the Android SDK (ANDROID_HOME); missing platforms are auto-installed by AGP.
      - name: Unit tests (core)
        run: ./gradlew --no-daemon :core:test

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: iskra-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: core/build/reports/tests/

      # Every push to main publishes the APK as a pre-release, so it can be
      # downloaded straight from the phone: Releases -> latest -> app-debug.apk
      - name: Rename APK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/debug/app-debug.apk "Iskra-${{ github.run_number }}-debug.apk"

      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Искра — сборка ${{ github.run_number }}
          prerelease: true
          body: |
            Debug-сборка из коммита ${{ github.sha }}.
            Установка: скачай APK на телефон и открой его. Подробности — README.md.
          files: Iskra-${{ github.run_number }}-debug.apk
