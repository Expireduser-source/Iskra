name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Build the signed release from main (creates the tag v<versionName>)"
        type: boolean
        default: false

permissions:
  contents: write   # needed to publish the APK as a GitHub Release

jobs:
  # Debug APK on every push (as before). Package ru.iskra.app.debug, fixed debug key from the repo.
  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # GitHub's ubuntu runners ship the Android SDK (ANDROID_HOME); missing platforms are auto-installed by AGP.
      - name: Test core, build debug APK, lint
        run: ./gradlew --no-daemon :core:test :app:assembleDebug :app:lintDebug

      - uses: actions/upload-artifact@v4
        with:
          name: iskra-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: core/build/reports/tests/

      # Lint does not fail the build. Its findings (old Android versions, OEM quirks) become annotations.
      - name: Lint findings as annotations
        if: always()
        run: python3 .github/scripts/lint_annotations.py app/build/reports/lint-results-debug.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*

      # Every push to main publishes the APK as a pre-release, so it can be
      # downloaded straight from the phone: Releases -> latest -> app-debug.apk
      - name: Rename APK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/debug/app-debug.apk "Iskra-${{ github.run_number }}-debug.apk"

      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Искра — сборка ${{ github.run_number }}
          prerelease: true
          body: |
            Debug-сборка из коммита ${{ github.sha }}.
            Установка: скачай APK на телефон и открой его. Подробности — README.md.
          files: Iskra-${{ github.run_number }}-debug.apk

  # Release APK only for a version tag (v0.4.0, ...). Package ru.iskra.app, signed with the owner's key
  # from GitHub Secrets. The key file exists only on the runner during this job.
  # Also from "Run workflow" with release = true on main: the tag is then created by this job.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (inputs.release && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tag must match versionName
        run: |
          v=$(sed -nE 's/^ *versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          tag="${{ github.ref_type == 'tag' && github.ref_name || '' }}"
          if [ -z "$tag" ]; then tag="v$v"; fi
          if [ "v$v" != "$tag" ]; then
            echo "::error::Tag $tag does not match versionName $v in app/build.gradle.kts"; exit 1
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Unit tests (core)
        run: ./gradlew --no-daemon :core:test

      # Tolerates what a pasted secret often carries (spaces, line breaks, the "NAME =" prefix from
      # iskra-release-secrets.txt) and says exactly which secret is wrong. Values are never printed.
      - name: Restore release key
        env:
          KEYSTORE_B64: ${{ secrets.ISKRA_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ISKRA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ISKRA_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ISKRA_KEY_PASSWORD }}
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          missing=""
          for n in KEYSTORE_B64:ISKRA_KEYSTORE_BASE64 STORE_PASS:ISKRA_KEYSTORE_PASSWORD KEY_ALIAS:ISKRA_KEY_ALIAS KEY_PASS:ISKRA_KEY_PASSWORD; do
            v="${n%%:*}"; if [ -z "${!v}" ]; then missing="$missing ${n#*:}"; fi
          done
          if [ -n "$missing" ]; then
            # Names only (they are not secret) so a typo in a name is visible; values are never printed.
            seen=$(printf '%s' "$ALL_SECRETS" | jq -r 'keys | map(select(. != "github_token")) | join(", ")')
            echo "::error::Missing secrets:$missing. Repository secrets this run can see: ${seen:-none}"; exit 1
          fi
          b64=$(printf '%s' "$KEYSTORE_B64" | sed -E 's/^[[:space:]]*ISKRA_KEYSTORE_BASE64[[:space:]]*=//' | tr -d ' \t\r\n')
          if ! printf '%s' "$b64" | base64 -d > "$RUNNER_TEMP/iskra-release.jks" 2>/dev/null; then
            echo "::error::ISKRA_KEYSTORE_BASE64 is not valid base64 (${#b64} characters, expected about 5664). Paste the whole text of ISKRA_KEYSTORE_BASE64.txt"; exit 1
          fi
          pass=$(printf '%s' "$STORE_PASS" | sed -E 's/^[[:space:]]*ISKRA_KEYSTORE_PASSWORD[[:space:]]*=//; s/^[[:space:]]+//; s/[[:space:]]+$//')
          alias=$(printf '%s' "$KEY_ALIAS" | sed -E 's/^[[:space:]]*ISKRA_KEY_ALIAS[[:space:]]*=//; s/^[[:space:]]+//; s/[[:space:]]+$//')
          keypass=$(printf '%s' "$KEY_PASS" | sed -E 's/^[[:space:]]*ISKRA_KEY_PASSWORD[[:space:]]*=//; s/^[[:space:]]+//; s/[[:space:]]+$//')
          if ! keytool -list -keystore "$RUNNER_TEMP/iskra-release.jks" -storepass "$pass" >/dev/null 2>&1; then
            echo "::error::The key file does not open: ISKRA_KEYSTORE_BASE64 is incomplete (${#b64} characters, expected about 5664) or ISKRA_KEYSTORE_PASSWORD is wrong"; exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/iskra-release.jks" -storepass "$pass" -alias "$alias" >/dev/null 2>&1; then
            echo "::error::ISKRA_KEY_ALIAS is not in the key file (expected: iskra)"; exit 1
          fi
          # Cleaned values for the build step.
          { echo "ISKRA_CLEAN_STORE_PASS<<EOF_PASS"; echo "$pass"; echo "EOF_PASS"
            echo "ISKRA_CLEAN_ALIAS=$alias"
            echo "ISKRA_CLEAN_KEY_PASS<<EOF_KEY"; echo "$keypass"; echo "EOF_KEY"; } >> "$GITHUB_ENV"
          echo "::add-mask::$pass"; echo "::add-mask::$keypass"
          echo "Key file restored and opened ($(stat -c%s "$RUNNER_TEMP/iskra-release.jks") bytes)"

      - name: Build release APK
        env:
          ISKRA_KEYSTORE: ${{ runner.temp }}/iskra-release.jks
          ISKRA_KEYSTORE_PASSWORD: ${{ env.ISKRA_CLEAN_STORE_PASS }}
          ISKRA_KEY_ALIAS: ${{ env.ISKRA_CLEAN_ALIAS }}
          ISKRA_KEY_PASSWORD: ${{ env.ISKRA_CLEAN_KEY_PASS }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Remove release key
        if: always()
        run: rm -f "$RUNNER_TEMP/iskra-release.jks"

      - name: Check signature (release key, not debug)
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "::error::No signed app-release.apk"; ls -R app/build/outputs/apk; exit 1; }
          signer=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$signer" verify --print-certs "$apk" | tee certs.txt
          if grep -qi "debug" certs.txt || grep -qi "15ad001f995aa0a5" certs.txt; then
            echo "::error::APK is signed with a debug key"; exit 1
          fi
          cp "$apk" "Iskra-${{ env.RELEASE_TAG }}-release.apk"
          sha256sum "Iskra-${{ env.RELEASE_TAG }}-release.apk" > "Iskra-${{ env.RELEASE_TAG }}-release.apk.sha256"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Искра ${{ env.RELEASE_TAG }}
          prerelease: false
          body: |
            Release-сборка из коммита ${{ github.sha }} (пакет ru.iskra.app, подпись владельца).
            Ставится рядом с debug-версией (ru.iskra.app.debug). Данные переносятся через «Память → Сохранить копию / Восстановить». Ключи API нужно ввести заново.
          files: |
            Iskra-${{ env.RELEASE_TAG }}-release.apk
            Iskra-${{ env.RELEASE_TAG }}-release.apk.sha256

